<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#FFC61A">

    <meta
        name="description"
        content="Learn the systems behind the Robot Systems Lab obstacle-avoidance robot, including sensing, movement, Bluetooth communication, and data logging."
    >

    <title>Robot Systems Lab | Engineering Learning Platform</title>

    <link rel="icon" type="image/png" href="rover-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app"></div>

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite">
    </div>

    <dialog id="reset-dialog">
        <form method="dialog">
            <h2>Reset learning progress?</h2>

            <p>
                This removes your selected path, lesson progress,
                quiz scores, and checklist entries from this browser.
            </p>

            <div class="dialog-actions">
                <button class="button secondary" value="cancel">
                    Cancel
                </button>

                <button
                    class="button danger"
                    id="confirm-reset"
                    value="confirm">
                    Reset progress
                </button>
            </div>
        </form>
    </dialog>

    <script src="demo-firmware.js"></script>
    <script src="demo.js"></script>
    <script src="app.js"></script>
    <script src="arena.js"></script>
    <script src="robot-3d.js"></script>
</body>
</html>
